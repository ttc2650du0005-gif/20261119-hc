
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIBBON RIBBON</title>
  <link rel="stylesheet" href="style.css">
</head>

<body id="home">

  <!-- ヘッダー -->
  <header class="site-header">
    <h1>RIBBON RIBBON</h1>

    <nav>
      <a href="#home">HOME</a>
      <a href="#ribbon">Ribbon</a>
      <a href="#item">Item</a>
    </nav>
  </header>

  <main>

    <!-- メインビジュアル -->
    <section class="hero">

      <div class="hero-copy">
        <h2>RIBBON</h2>

        <!-- 横長のリボン飾り画像 -->
        <img
          class="line-ribbon"
          src="images/ribbon-line.png"
          alt=""
        >

        <p>
          小さいリボンに、大きなときめきを。<br>
          毎日に可愛さを、紹介します。
        </p>
      </div>

      <!-- 右上の大きなリボン画像 -->
      <img
        class="hero-bow"
        src="images/bow-main.png"
        alt=""
      >

    </section>


    <!-- リボンの魅力 -->
    <section class="feature" id="ribbon">

      <!-- 3つの丸 -->
      <div class="circle-group">

        <div class="circle circle-top">
          <h3>かわいさ</h3>
          <p>毎日にときめきを</p>
        </div>

        <div class="circle circle-left">
          <h3>贈り物</h3>
          <p>
            大切な人に<br>
            かわいさを
          </p>
        </div>

        <div class="circle circle-right">
          <h3>アレンジ</h3>
          <p>自分らしく楽しむ</p>
        </div>

      </div>


      <!-- リボンの魅力の説明 -->
      <div class="feature-copy">

        <img
          class="line-ribbon"
          src="images/ribbon-line.png"
          alt=""
        >

        <h2>リボンの魅力</h2>

        <p>
          リボンは素材や形によって、<br>
          さまざまなかわいさがあります。<br>
          身につけるだけでなく、<br>
          プレゼントにも使える素敵なアイテムです。
        </p>

      </div>

    </section>


    <!-- お気に入りのリボン -->
    <section class="item-section" id="item">

      <div class="item-copy">

        <img
          class="line-ribbon"
          src="images/ribbon-line.png"
          alt=""
        >

        <h2>
          お気に入りのリボンを<br>
          見つけよう
        </h2>

        <p>
          サテンやレースなど、いろいろな素材の
          リボンがあります。自分のお気に入りを
          見つけて、毎日のおしゃれを楽しみましょう。
        </p>

      </div>


      <!-- リボンの写真 -->
      <img
        class="item-photo"
        src="images/ribbon-items.png"
        alt="リボンやレースのアイテム"
      >

    </section>

  </main>


  <!-- 下部のリボン飾り -->
  <img
    class="footer-bow"
    src="images/bow-main.png"
    alt=""
  >


  <!-- フッター -->
  <footer>
    <p>© 2026 RIBBON RIBBON</p>
  </footer>

</body>
</html>
